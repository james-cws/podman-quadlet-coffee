server {
	listen unix:/sockets/coffee.sock;
	# Note this, since we're only listening on a socket it's not
	# really appropriate/necessary to handle SSL here: do that in the
	# upstream proxy, left as an excercise for the user ;)
	#
	# (I kid, keep an eye out for a reverse proxy demo in the future)

	server_name coffee.yourdomain.com;
	# CHANGE THIS!! --------^

	# Many blogs do this a little differently (and incorrectly in my
	# opinion) where they'll serve the html page normally and _then_
	# do some variation of returning 418. Instead, what we're doing
	# is immediately throwing error 418 on accessing the web root,
	# define the error page that'll be served on code 418, and point
	# the server at the location to find the error html we'll respond
	# with when the error inevitably occurs.
	location / {
		return 418;
	}

	error_page 418 /custom_418.html;
	location = /custom_418.html {
		root /usr/share/nginx/html/;
		internal;
	}
}
